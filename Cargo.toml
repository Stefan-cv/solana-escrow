[workspace]
members = [
    "programs/*"
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.89.0"

# NOTE: this workspace intentionally differs from solana-vault's profile.
# The original fat-LTO settings were removed while chasing a 4424-byte
# `Take::try_accounts` stack frame (SBF limit: 4096); it turned out LTO was
# not the driver — the real fix was reducing validated accounts in `Take`
# (see DESIGN.md §6). The leaner profile is kept; the vault keeps its own.
[profile.release]
overflow-checks = true
